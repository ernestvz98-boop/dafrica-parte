<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://sbocfjxamjmwabmqbeyw.supabase.co; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>DAFRICA Control</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <section id="loginView">
    <div class="login-card">
      <div class="login-brand">
        <img src="dafrica-logo.png.png" alt="DAFRICA">
        <div>
          <h1>DAFRICA Control</h1>
          <p>Acceso privado de empresa</p>
        </div>
      </div>

      <form id="loginForm" autocomplete="on">
        <label for="loginEmail">Correo</label>
        <input id="loginEmail" type="email" autocomplete="username" required>

        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>

        <button id="loginButton" class="btn" type="submit">Entrar</button>
        <div id="loginMsg" aria-live="polite"></div>
      </form>

      <div class="private-note">
        Sistema interno. Sin una sesión autorizada no se consulta información de trabajadores, obras, maquinaria, documentos, costes ni partes.
      </div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <aside id="sidebar" class="sidebar">
      <div class="side-brand">
        <img src="dafrica-logo.png.png" alt="">
        <div>
          <strong>DAFRICA Control</strong>
          <span>Web privada</span>
        </div>
      </div>

      <nav id="nav" class="nav" aria-label="Módulos"></nav>

      <div class="side-user">
        <strong id="sideUserName">Usuario</strong>
        <div id="sideUserEmail" class="email"></div>
        <div id="sideUserRoles" class="roles"></div>
        <button id="logoutButton" class="btn secondary" type="button">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="row">
          <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Abrir menú">☰</button>
          <div>
            <h1 id="pageTitle">DAFRICA Control</h1>
            <div id="pageSubtitle" class="sub"></div>
          </div>
        </div>
        <span class="badge">Privado</span>
      </header>

      <main id="content" class="content">
        <div class="loader">Cargando…</div>
      </main>
    </div>
  </section>

  <script src="control-1.js" defer></script>
  <script src="control-2.js" defer></script>
  <script src="control-3.js" defer></script>
  <script src="control-4.js" defer></script>
  <script src="control-5.js" defer></script>
  <script src="control-6.js" defer></script>
</body>
</html>
