<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DAFRICA Parte</title>

  <style>
    :root{
      --bg:#f5f6f8;
      --card:#ffffff;
      --text:#172033;
      --muted:#6b7280;
      --border:#dfe3e8;
      --accent:#2875e8;
      --accent-dark:#195fc9;
      --ok:#18794e;
      --danger:#b42318;
      --soft:#eef2f7;
      --warning-bg:#fff8e8;
      --warning:#8a5a00;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-text-size-adjust:100%;
    }

    main{
      width:min(780px,100%);
      margin:0 auto;
      padding:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
    }

    .brand img{
      width:92px;
      height:auto;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
    }

    h1{
      font-size:1.55rem;
      margin:0 0 4px;
    }

    .sub{
      margin:0;
      color:var(--muted);
    }

    .badge{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      background:var(--soft);
      color:var(--muted);
      font-size:.78rem;
      vertical-align:middle;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      margin-bottom:16px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    @media(max-width:640px){
      .grid{grid-template-columns:1fr}
    }

    label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
    }

    input,select,textarea,button,audio{
      width:100%;
      font:inherit;
    }

    input,select,textarea{
      border:1px solid var(--border);
      border-radius:11px;
      padding:12px;
      min-height:46px;
      background:#fff;
      color:var(--text);
      font-size:16px;
    }

    textarea{
      min-height:140px;
      resize:vertical;
    }

    button{
      border:0;
      border-radius:11px;
      padding:13px 14px;
      min-height:48px;
      cursor:pointer;
      font-weight:750;
      touch-action:manipulation;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .primary{
      background:var(--accent);
      color:#fff;
    }

    .primary:active{
      background:var(--accent-dark);
    }

    .secondary{
      background:var(--soft);
      color:var(--text);
    }

    .danger{
      background:#fff4f4;
      color:var(--danger);
      border:1px solid #efcaca;
    }

    .record{
      background:#fff0f0;
      color:var(--danger);
      border:1px solid #efcaca;
    }

    .stop{
      background:#d98782;
      color:white;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    @media(max-width:560px){
      .actions{grid-template-columns:1fr}
    }

    .stack{
      display:grid;
      gap:10px;
    }

    .hidden{
      display:none!important;
    }

    .muted{
      color:var(--muted);
      font-size:.92rem;
    }

    .small{
      color:var(--muted);
      font-size:.84rem;
    }

    .status{
      margin-top:12px;
      padding:11px 12px;
      border-radius:11px;
      background:#eef7f2;
      color:var(--ok);
      font-size:.92rem;
      overflow-wrap:anywhere;
    }

    .compat{
      padding:10px 12px;
      border-radius:11px;
      background:var(--warning-bg);
      color:var(--warning);
      font-size:.86rem;
      margin-top:10px;
    }

    .recording{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--danger);
      font-weight:700;
      margin-top:12px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--danger);
    }

    .photo-list{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:10px;
      margin-top:14px;
    }

    .photo{
      border:1px solid var(--border);
      border-radius:11px;
      overflow:hidden;
      background:#fafafa;
    }

    .photo img{
      width:100%;
      height:105px;
      object-fit:cover;
      display:block;
      background:#f1f3f5;
    }

    .photo .fallback{
      min-height:105px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
      text-align:center;
      color:var(--muted);
      font-size:.82rem;
      background:#f1f3f5;
    }

    .photo small{
      display:block;
      padding:8px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .section-title{
      font-size:1.05rem;
      margin:0 0 12px;
    }

    .spacer-top{
      margin-top:10px;
    }

    .device-info{
      font-size:.8rem;
      color:var(--muted);
      margin-top:8px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
<main>

  <div class="brand">
    <img src="dafrica-logo.png.png" alt="DAFRICA Bierzo">
    <div>
      <h1>DAFRICA Parte <span class="badge">v1.5</span></h1>
      <p class="sub">Parte diario de obra · móvil y ordenador</p>
    </div>
  </div>

  <section class="card">
    <div class="grid">

      <div>
        <label for="obra">Obra</label>

        <select id="obra">
          <option value="">Selecciona una obra</option>
          <option>Torre del Bierzo</option>
          <option>Taller Carpintería Colmenas Abejas - Tremor de Arriba</option>
          <option>Castillo de los Templarios</option>
          <option>CS Aravaca</option>
        </select>

        <div class="spacer-top">
          <button id="nuevaObraBtn" class="secondary" type="button">
            ➕ Crear nueva obra
          </button>
        </div>

        <div id="nuevaObraBox" class="hidden spacer-top">
          <input id="nuevaObraNombre" type="text" placeholder="Nombre de la nueva obra">
          <button id="guardarNuevaObra" class="primary spacer-top" type="button">
            Guardar obra
          </button>
        </div>
      </div>

      <div>
        <label for="fecha">Fecha</label>
        <input id="fecha" type="date">
      </div>

      <div>
        <label for="encargado">Encargado</label>
        <input id="encargado" type="text" placeholder="Nombre del encargado">
      </div>

      <div>
        <label for="estado">Estado</label>
        <input id="estado" type="text" value="Borrador" disabled>
      </div>

    </div>
  </section>

  <section class="card">
    <h2 class="section-title">🎙️ Audio del encargado</h2>

    <div class="actions">
      <button id="recordBtn" class="record" type="button">
        🎙️ Empezar grabación
      </button>

      <button id="stopBtn" class="stop" type="button" disabled>
        ■ Detener
      </button>
    </div>

    <div id="recordingState" class="recording hidden">
      <span class="dot"></span>
      <span>Grabando… <span id="timer">00:00</span></span>
    </div>

    <div id="audioBox" class="hidden spacer-top">
      <audio id="audioPlayer" controls></audio>
      <p id="audioInfo" class="small"></p>

      <div class="stack">
        <button id="transcribirBtn" class="primary" type="button">
          ✨ Transcribir audio
        </button>

        <button id="deleteAudio" class="danger" type="button">
          Eliminar audio
        </button>
      </div>
    </div>

    <div class="spacer-top">
      <label for="audioUpload">O subir un audio ya grabado</label>
      <input
        id="audioUpload"
        type="file"
        accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.aac"
      >
    </div>

    <div id="compatInfo" class="compat">
      Comprobando compatibilidad del dispositivo…
    </div>

    <p id="deviceInfo" class="device-info"></p>
  </section>

  <section class="card">
    <label for="notas">Información / redacción del parte</label>

    <textarea
      id="notas"
      placeholder="La transcripción aparecerá aquí o puedes escribir manualmente."
    ></textarea>

    <p class="small">
      La transcripción automática requiere crédito disponible en la API de OpenAI.
    </p>
  </section>

  <section class="card">
    <h2 class="section-title">Fotografías</h2>

    <input
      id="fotos"
      type="file"
      accept="image/*,.heic,.heif"
      multiple
    >

    <div id="photoList" class="photo-list"></div>

    <p id="photoCount" class="muted">
      0 fotografías guardadas.
    </p>

    <button id="clearPhotos" class="danger" type="button">
      Eliminar fotografías
    </button>
  </section>

  <section class="card">
    <div class="stack">

      <button id="guardar" class="secondary" type="button">
        Guardar borrador
      </button>

      <button id="pdfBtn" class="secondary" type="button">
        📄 Generar PDF
      </button>

      <div class="actions">
        <button id="correoBtn" class="primary" type="button">
          📧 Enviar correo automático
        </button>

        <button id="whatsappBtn" class="secondary" type="button">
          💬 Enviar por WhatsApp
        </button>
      </div>

      <button
        id="abrirPDFAndroidBtn"
        class="primary hidden"
        type="button"
      >
        📂 Abrir PDF para compartir
      </button>

      <button id="cerrar" class="primary" type="button">
        Cerrar parte
      </button>

      <button id="limpiar" class="danger" type="button">
        Borrar borrador de prueba
      </button>

    </div>

    <div id="status" class="status">
      Preparando almacenamiento…
    </div>
  </section>

</main>

<script>
(() => {

  /* =====================================================
     CONFIGURACIÓN GENERAL
  ====================================================== */

  const BACKEND_URL =
    "https://dafrica-parte-backend.onrender.com";

  const LOGO_URL =
    "dafrica-logo.png.png";

  const DB_NAME =
    "dafrica_parte_db";

  const DB_VERSION = 1;

  const STORE =
    "drafts";

  const DRAFT_ID =
    "current";

  const OBRAS_KEY =
    "dafrica_obras_personalizadas";


  /* =====================================================
     DOM
  ====================================================== */

  const el =
    id => document.getElementById(id);

  const obra = el("obra");
  const fecha = el("fecha");
  const encargado = el("encargado");
  const estado = el("estado");
  const notas = el("notas");

  const fotos = el("fotos");
  const photoList = el("photoList");
  const photoCount = el("photoCount");

  const recordBtn = el("recordBtn");
  const stopBtn = el("stopBtn");
  const recordingState = el("recordingState");
  const timerEl = el("timer");

  const audioBox = el("audioBox");
  const audioPlayer = el("audioPlayer");
  const audioInfo = el("audioInfo");
  const audioUpload = el("audioUpload");

  const compatInfo = el("compatInfo");
  const deviceInfo = el("deviceInfo");

  const status = el("status");


  /* =====================================================
     ESTADO
  ====================================================== */

  let db = null;

  let mediaRecorder = null;
  let mediaStream = null;
  let chunks = [];

  let timerInterval = null;
  let seconds = 0;

  let audioBlob = null;
  let audioObjectUrl = null;

  let photosData = [];

  /* Copias ligeras de las fotos para el PDF único de Android.
     Se preparan al seleccionar las fotos, no al pulsar WhatsApp. */
  let photosPdfCache = [];
  let photosPdfPreparing = false;

  /* PDF preparado para el flujo de dos pasos en Android */
  let androidPdfUrl = null;
  let androidPdfNombre = null;

  /* El logo se carga con antelación para que al pulsar
     "Compartir" Safari no pierda el gesto del usuario. */
  let logoPDFCache = null;


  /* =====================================================
     UTILIDADES
  ====================================================== */

  function setStatus(texto){
    status.textContent = texto;
  }


  function todayISO(){

    const d = new Date();

    const y =
      d.getFullYear();

    const m =
      String(
        d.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        d.getDate()
      ).padStart(2, "0");

    return `${y}-${m}-${day}`;
  }


  function sanitizarNombre(nombre){

    return nombre.replace(
      /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ._-]+/g,
      "_"
    );
  }


  function detectarPlataforma(){

    const ua =
      navigator.userAgent || "";

    if(/iPhone|iPad|iPod/i.test(ua)){
      return "iPhone / iPad";
    }

    if(/Android/i.test(ua)){
      return "Android";
    }

    if(/Windows/i.test(ua)){
      return "Windows";
    }

    if(/Macintosh|Mac OS X/i.test(ua)){
      return "Mac";
    }

    if(/Linux/i.test(ua)){
      return "Linux";
    }

    return "Dispositivo";
  }


  function detectarCompatibilidad(){

    const puedeGrabar =
      !!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia &&
        typeof MediaRecorder !== "undefined"
      );

    const puedeCompartir =
      typeof navigator.share === "function";

    const puedeCompartirArchivos =
      typeof navigator.canShare === "function";

    const plataforma =
      detectarPlataforma();

    deviceInfo.textContent =
      `${plataforma} · Grabación: ${puedeGrabar ? "sí" : "no"} · Compartir: ${puedeCompartir ? "sí" : "no"}`;

    if(puedeGrabar){

      compatInfo.textContent =
        "El dispositivo permite grabar audio. Si el navegador no concede el micrófono, puedes subir un audio ya grabado.";

    }else{

      compatInfo.textContent =
        "Este navegador no ofrece grabación directa. Usa «subir un audio ya grabado»; el resto de la aplicación seguirá funcionando.";
    }

    if(!puedeCompartir){

      compatInfo.textContent +=
        " Para compartir, se descargarán los archivos como alternativa.";
    }

    return {
      puedeGrabar,
      puedeCompartir,
      puedeCompartirArchivos
    };
  }


  /* =====================================================
     INDEXED DB
  ====================================================== */

  function openDB(){

    return new Promise(
      (resolve, reject) => {

        const req =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

        req.onupgradeneeded =
          () => {

            const database =
              req.result;

            if(
              !database.objectStoreNames
                .contains(STORE)
            ){

              database.createObjectStore(
                STORE,
                { keyPath:"id" }
              );
            }
          };

        req.onsuccess =
          () => resolve(
            req.result
          );

        req.onerror =
          () => reject(
            req.error
          );
      }
    );
  }


  function putDraft(data){

    return new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(
            STORE,
            "readwrite"
          );

        tx.objectStore(STORE)
          .put(data);

        tx.oncomplete =
          () => resolve();

        tx.onerror =
          () => reject(
            tx.error
          );
      }
    );
  }


  function getDraft(){

    return new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(
            STORE,
            "readonly"
          );

        const req =
          tx.objectStore(STORE)
            .get(DRAFT_ID);

        req.onsuccess =
          () => resolve(
            req.result || null
          );

        req.onerror =
          () => reject(
            req.error
          );
      }
    );
  }


  function deleteDraft(){

    return new Promise(
      (resolve, reject) => {

        const tx =
          db.transaction(
            STORE,
            "readwrite"
          );

        tx.objectStore(STORE)
          .delete(DRAFT_ID);

        tx.oncomplete =
          () => resolve();

        tx.onerror =
          () => reject(
            tx.error
          );
      }
    );
  }


  /* =====================================================
     BORRADOR
  ====================================================== */

  function draftSnapshot(){

    return {
      id:DRAFT_ID,
      obra:obra.value,
      fecha:fecha.value,
      encargado:
        encargado.value.trim(),
      estado:estado.value,
      notas:notas.value,
      audioBlob,
      photosData,
      updatedAt:
        new Date().toISOString()
    };
  }


  async function saveDraft(
    mensaje =
      "Borrador guardado correctamente."
  ){

    if(!db){

      setStatus(
        "El almacenamiento todavía no está disponible."
      );

      return;
    }

    try{

      await putDraft(
        draftSnapshot()
      );

      setStatus(mensaje);

    }catch(error){

      console.error(error);

      setStatus(
        "No se pudo guardar el borrador."
      );
    }
  }


  async function loadDraft(){

    fecha.value =
      todayISO();

    const data =
      await getDraft();

    if(!data){

      setStatus(
        "Borrador nuevo preparado."
      );

      return;
    }

    obra.value =
      data.obra || "";

    fecha.value =
      data.fecha || todayISO();

    encargado.value =
      data.encargado || "";

    estado.value =
      data.estado || "Borrador";

    notas.value =
      data.notas || "";

    photosData =
      Array.isArray(
        data.photosData
      )
        ? data.photosData
        : [];

    audioBlob =
      data.audioBlob || null;

    renderPhotos();
    showAudio(audioBlob);

    /* Preparamos las fotos recuperadas en segundo plano. */
    prepararFotosPdfCache(
      false
    ).catch(
      error => {
        console.warn(
          "No se pudieron preparar las fotos recuperadas:",
          error
        );
      }
    );

    setStatus(
      "Borrador anterior recuperado."
    );
  }


  /* =====================================================
     OBRAS
  ====================================================== */

  function cargarObrasPersonalizadas(){

    let obrasGuardadas = [];

    try{

      obrasGuardadas =
        JSON.parse(
          localStorage.getItem(
            OBRAS_KEY
          ) || "[]"
        );

    }catch{

      obrasGuardadas = [];
    }

    obrasGuardadas.forEach(
      nombre => {

        const yaExiste =
          Array.from(
            obra.options
          ).some(
            option =>
              option.value === nombre
          );

        if(!yaExiste){

          const option =
            document.createElement(
              "option"
            );

          option.value =
            nombre;

          option.textContent =
            nombre;

          obra.appendChild(
            option
          );
        }
      }
    );
  }


  async function crearNuevaObra(){

    const input =
      el("nuevaObraNombre");

    const nombre =
      input.value.trim();

    if(!nombre){

      setStatus(
        "Escribe el nombre de la nueva obra."
      );

      return;
    }

    const yaExiste =
      Array.from(
        obra.options
      ).some(
        option =>
          option.value
            .toLowerCase() ===
          nombre.toLowerCase()
      );

    if(yaExiste){

      setStatus(
        "Esa obra ya existe."
      );

      return;
    }

    let obrasGuardadas = [];

    try{

      obrasGuardadas =
        JSON.parse(
          localStorage.getItem(
            OBRAS_KEY
          ) || "[]"
        );

    }catch{

      obrasGuardadas = [];
    }

    obrasGuardadas.push(
      nombre
    );

    localStorage.setItem(
      OBRAS_KEY,
      JSON.stringify(
        obrasGuardadas
      )
    );

    const option =
      document.createElement(
        "option"
      );

    option.value =
      nombre;

    option.textContent =
      nombre;

    obra.appendChild(
      option
    );

    obra.value =
      nombre;

    input.value = "";

    el("nuevaObraBox")
      .classList.add(
        "hidden"
      );

    await saveDraft(
      "Nueva obra creada y guardada."
    );
  }


  /* =====================================================
     AUDIO MULTIPLATAFORMA
  ====================================================== */

  function seleccionarMimeGrabacion(){

    if(
      typeof MediaRecorder ===
        "undefined"
    ){
      return "";
    }

    const candidatos = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4;codecs=mp4a.40.2",
      "audio/mp4",
      "audio/ogg;codecs=opus",
      "audio/ogg"
    ];

    for(
      const tipo of candidatos
    ){

      try{

        if(
          typeof MediaRecorder.isTypeSupported ===
            "function" &&
          MediaRecorder.isTypeSupported(
            tipo
          )
        ){

          return tipo;
        }

      }catch{}
    }

    return "";
  }


  function extensionAudioDesdeTipo(tipo){

    const t =
      (tipo || "")
        .toLowerCase();

    if(
      t.includes("mp4") ||
      t.includes("m4a")
    ){
      return "m4a";
    }

    if(
      t.includes("mpeg") ||
      t.includes("mp3")
    ){
      return "mp3";
    }

    if(t.includes("wav")){
      return "wav";
    }

    if(t.includes("ogg")){
      return "ogg";
    }

    if(t.includes("aac")){
      return "aac";
    }

    return "webm";
  }


  function extensionAudioDesdeNombre(nombre){

    const match =
      String(nombre || "")
        .toLowerCase()
        .match(
          /\.([a-z0-9]+)$/
        );

    return match
      ? match[1]
      : "";
  }


  function revokeAudioUrl(){

    if(audioObjectUrl){

      URL.revokeObjectURL(
        audioObjectUrl
      );

      audioObjectUrl =
        null;
    }
  }


  function showAudio(blob){

    revokeAudioUrl();

    audioBlob =
      blob;

    if(!blob){

      audioPlayer
        .removeAttribute("src");

      audioBox
        .classList.add(
          "hidden"
        );

      audioInfo.textContent =
        "";

      return;
    }

    audioObjectUrl =
      URL.createObjectURL(
        blob
      );

    audioPlayer.src =
      audioObjectUrl;

    audioBox
      .classList.remove(
        "hidden"
      );

    const kb =
      Math.max(
        1,
        Math.round(
          blob.size / 1024
        )
      );

    audioInfo.textContent =

  function updateTimer(){

    const min =
      String(
        Math.floor(
          seconds / 60

    const sec =
      String(
        seconds % 60
      ).padStart(2, "0");

    timerEl.textContent =
      `${min}:${sec}`;

  function stopTracks(){

    if(mediaStream){

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      mediaStream =
        null;
    }
  }


  async function startRecording(){

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia ||
      typeof MediaRecorder ===
        "undefined"
    ){

      setStatus(
        "Este navegador no permite grabar directamente. Usa «subir un audio ya grabado»."
      );

      return;
    }

    try{

      mediaStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      const mimeType =
        seleccionarMimeGrabacion();

      const opciones =
        mimeType
          ? { mimeType }
          : undefined;

      mediaRecorder =
        opciones
          ? new MediaRecorder(
              mediaStream,
              opciones
            )
          : new MediaRecorder(
              mediaStream
            );

      chunks = [];

      mediaRecorder
        .ondataavailable =
          event => {

            if(
              event.data &&
              event.data.size
            ){

              chunks.push(
                event.data
              );
            }
          };

      mediaRecorder.onstop =
        async () => {

          const tipo =
            mediaRecorder.mimeType ||
            chunks[0]?.type ||
            mimeType ||
            "audio/webm";

          const blob =
            new Blob(
              chunks,
              {
                type:tipo
              }
            );

          showAudio(
            blob
          );

          stopTracks();

          await saveDraft(
            "Audio grabado y guardado."
          );
        };

      mediaRecorder.start(
        250
      );

      recordBtn.disabled =
        true;

      stopBtn.disabled =
        false;

      recordingState
        .classList.remove(
          "hidden"
        );

      seconds = 0;

      updateTimer();

      timerInterval =
        setInterval(
          () => {

            seconds++;
            updateTimer();

          },
          1000
        );

      setStatus(
        "Grabando audio…"
      );

    }catch(error){

      console.error(error);

      setStatus(
        "No se pudo acceder al micrófono. Revisa permisos o sube un audio grabado."
      );
    }
  }


  function stopRecording(){

    if(
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ){

      mediaRecorder.stop();
    }

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;

    recordingState
      .classList.add(
        "hidden"
      );

    recordBtn.disabled =
      false;

    stopBtn.disabled =
      true;
  }


  async function handleAudioUpload(){

    const file =
      audioUpload.files?.[0];

    if(!file){
      return;
    }

    const extension =
      extensionAudioDesdeNombre(
        file.name
      );

    const permitidoPorExtension =
      [
        "m4a",
        "mp3",
        "wav",
        "webm",
        "ogg",
        "aac",
        "mp4"
      ].includes(
        extension
      );

    const permitidoPorTipo =
      file.type
        ? file.type.startsWith(
            "audio/"
          )
        : false;

    if(
      !permitidoPorTipo &&
      !permitidoPorExtension
    ){

      setStatus(
        "El archivo seleccionado no parece un audio compatible."
      );

      return;
    }

    showAudio(file);

    await saveDraft(
      "Audio seleccionado y guardado."
    );
  }

  function prepararFotoLigeraPDF(
    item
  ){

    return new Promise(
      resolve => {

        const url =
          URL.createObjectURL(
            item.blob
          );

        const img =
          new Image();

        img.onload =
          () => {

            try{

              const maxLado =
                1280;

              const escala =
                Math.min(
                  1,
                  maxLado /
                  Math.max(
                    img.width,
                    img.height
                  )
                );

              const width =
                Math.max(
                  1,
                  Math.round(
                    img.width *
                    escala
                  )
                );

              const height =
                Math.max(
                  1,
                  Math.round(
                    img.height *
                    escala
                  )
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              const dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  0.68
                );

              URL.revokeObjectURL(
                url
              );

              resolve({
                dataUrl,
                width,
                height,
                name:
                  item.name ||
                  "Fotografía"
              });

            }catch(error){

              console.warn(
                "No se pudo preparar una fotografía para PDF:",
                error
              );

              URL.revokeObjectURL(
                url
              );

              resolve(null);
            }
          };

        img.onerror =
          () => {

            URL.revokeObjectURL(
              url
            );

            resolve(null);
          };

        img.src =
          url;
      }
    );
  }

  function renderPhotos(){

    photoList.innerHTML =
      "";

    photosData.forEach(
      (item, index) => {

        const wrap =
          document.createElement(
            "div"
          );

        wrap.className =
          "photo";

        const img =
          document.createElement(
            "img"
          );

        img.alt =
          item.name ||
          `Foto ${index + 1}`;

        const reader =
          new FileReader();

        reader.onload =
          event => {

            img.src =
              event.target.result;
          };

        reader.onerror =
          () => {

            img.remove();

            const fallback =
              document.createElement(
                "div"
              );

            fallback.className =
              "fallback";

            fallback.textContent =
              "Vista previa no disponible. La foto se conservará para compartir.";

            wrap.prepend(
              fallback
            );
          };

        try{

          reader.readAsDataURL(
            item.blob
          );

        }catch{

          const fallback =
            document.createElement(
              "div"
            );

          fallback.className =
            "fallback";

          fallback.textContent =
            "Vista previa no disponible.";

          wrap.appendChild(
            fallback
          );
        }

        const cap =
          document.createElement(
            "small"
          );

        cap.textContent =
          item.name ||
          `Foto ${index + 1}`;

        wrap.append(
          img,
          cap
        );

        photoList.appendChild(
          wrap
        );
      }
    );

    photoCount.textContent =
      `${photosData.length} fotografía${photosData.length === 1 ? "" : "s"} guardada${photosData.length === 1 ? "" : "s"}.`;
  }

    const valid =
      files
        .filter(

  async function transcribirAudio(){

    if(!audioBlob){

      setStatus(
        "Primero debes grabar o seleccionar un audio."
      );

      return;
    }

    try{

      setStatus(
        "Transcribiendo audio con IA…"
      );

      const formData =
        new FormData();

      const tipo =
        audioBlob.type ||
        "";

      let extension =
        extensionAudioDesdeTipo(
          tipo
        );

      if(
        audioBlob.name
      ){

        const extNombre =
          extensionAudioDesdeNombre(
            audioBlob.name
          );

        if(extNombre){
          extension =
            extNombre;
        }
      }

      formData.append(
        "audio",
        audioBlob,
        `parte.${extension}`
      );

      const respuesta =
        await fetch(
          `${BACKEND_URL}/transcribir`,
          {
            method:"POST",
            body:formData
          }
        );

      let datos = {};

      try{

        datos =
          await respuesta.json();

      }catch{

        datos = {};
      }

      if(
        !respuesta.ok
      ){

        throw new Error(
          datos.mensaje ||
          `Error HTTP ${respuesta.status}`
        );
      }

      notas.value =
        datos.texto || "";

      setStatus(
        "Audio transcrito correctamente."
      );

      /* Guardamos el borrador después, sin mantener
         bloqueada la interfaz mientras IndexedDB termina. */
      saveDraft(
        "Audio transcrito correctamente."
      );

    }catch(error){

      console.error(error);

      setStatus(
        "Error al transcribir: " +
        error.message
      );
    }
  }

  function construirArchivosCompartir(
    resultado
  ){

    const archivoPDF =
      new File(
        [resultado.blob],
        resultado.nombreArchivo,
        {
          type:
            "application/pdf"
        }
      );

    const archivos =
      [archivoPDF];

    photosData.forEach(
      (foto, indice) => {

        const nombreFoto =
          foto.name ||
          `Foto_${indice + 1}.jpg`;

        const archivoFoto =
          new File(
            [foto.blob],
            nombreFoto,
            {
              type:
                foto.type ||
                foto.blob.type ||
                "application/octet-stream"
            }
          );

        archivos.push(
          archivoFoto
        );
      }
    );

    return archivos;
  }


  function descargarBlob(
    blob,
    nombre
  ){

    const url =
      URL.createObjectURL(
        blob
      );

    const enlace =
      document.createElement(
        "a"
      );

    enlace.href =
      url;

    enlace.download =
      nombre;

    enlace.style.display =
      "none";

    document.body.appendChild(
      enlace
    );

    enlace.click();

    enlace.remove();

    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      1500
    );
  }


  async function fallbackDescargas(
    resultado
  ){

    descargarBlob(
      resultado.blob,
      resultado.nombreArchivo
    );

    /* Algunos navegadores bloquean varias
       descargas automáticas. Por eso intentamos
       las fotos con una pequeña separación. */

    for(
      let i = 0;
      i < photosData.length;
      i++
    ){

      const foto =
        photosData[i];

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            250
          )
      );

      descargarBlob(
        foto.blob,
        foto.name ||
        `Foto_${i + 1}.jpg`
      );
    }

    setStatus(
      "PDF y fotografías preparados como descargas. Puedes adjuntarlos en correo o WhatsApp."
    );
  }

        }catch(error){

          console.warn(
            "No se pudo insertar el logo:",
            error
          );
        }
      }

      doc.setFontSize(18);
      doc.text(
        "DAFRICA BIERZO",
        65,
        22
      );

      doc.setFontSize(15);
      doc.text(
        "PARTE DIARIO DE OBRA",
        65,
        32
      );

      doc.setFontSize(11);

      doc.text(
        `Obra: ${obra.value}`,
        20,
        58
      );

      doc.text(
        `Fecha: ${fecha.value}`,
        20,
        66
      );

      doc.text(
        `Encargado: ${encargado.value.trim()}`,
        20,
        74
      );

      doc.line(
        20,
        81,
        190,
        81
      );

      doc.setFontSize(12);
      doc.text(
        "Información del parte",
        20,
        93
      );

      doc.setFontSize(10);

      const textoParte =
        notas.value.trim() ||
        "Sin información redactada.";

      const lineas =
        doc.splitTextToSize(
          textoParte,
          170
        );

      let y =
        103;

      for(
        const linea of lineas
      ){

        if(y > 270){

          doc.addPage();
          y = 25;
        }

        doc.text(
          linea,
          20,
          y
        );

        y += 5;
      }


      /* Registro fotográfico comprimido */
      if(
        photosData.length > 0
      ){

        doc.addPage();

        doc.setFontSize(14);
        doc.text(
          "REGISTRO FOTOGRÁFICO",
          20,
          20
        );

        let fotoY =
          30;

        let numero =
          1;

        photosPdfCache.forEach(
          foto => {

            if(!foto){
              return;
            }

            const maxW =
              170;

            const maxH =
              105;

            const escala =
              Math.min(
                maxW /
                  foto.width,
                maxH /
                  foto.height
              );

            const w =
              foto.width *
              escala;

            const h =
              foto.height *
              escala;

            if(
              fotoY + h + 14 >
              285
            ){

              doc.addPage();

              fotoY =
                20;
            }

            doc.setFontSize(9);

            doc.text(
              `Foto ${numero}`,
              20,
              fotoY
            );

            fotoY +=
              4;

            doc.addImage(
              foto.dataUrl,
              "JPEG",
              20,
              fotoY,
              w,
              h,
              undefined,
              "FAST"
            );

            fotoY +=
              h + 10;

            numero++;
          }
        );
      }

      const nombreObra =
        sanitizarNombre(
          obra.value
        );

      const nombreArchivo =
        `${fecha.value}_Parte_${nombreObra}_CON_FOTOS.pdf`;

      return {
        blob:
          doc.output(
            "blob"
          ),
        nombreArchivo
      };

    }catch(error){

      console.error(
        "Error creando PDF Android con fotos:",
        error
      );

      setStatus(
        "No se pudo crear el PDF con fotografías."
      );

      return null;
    }
  }


  function limpiarPDFAndroidPreparado(){

    if(androidPdfUrl){

      URL.revokeObjectURL(
        androidPdfUrl
      );

      androidPdfUrl =
        null;
    }

    androidPdfNombre =
      null;

    el("abrirPDFAndroidBtn")
      .classList.add(
        "hidden"
      );
  }


  function prepararPDFAndroidParaAbrir(
    combinado
  ){

    limpiarPDFAndroidPreparado();

    androidPdfUrl =
      URL.createObjectURL(
        combinado.blob
      );

    androidPdfNombre =
      combinado.nombreArchivo;

    el("abrirPDFAndroidBtn")
      .classList.remove(
        "hidden"
      );
  }


  function abrirPDFAndroid(){

    if(!androidPdfUrl){

      setStatus(
        "Primero pulsa «Enviar por WhatsApp» para preparar el PDF."
      );

      return;
    }

    const nuevaVentana =
      window.open(
        androidPdfUrl,
        "_blank"
      );

    if(!nuevaVentana){

      /* Si el navegador bloquea una nueva pestaña,
         intentamos abrirlo en la pestaña actual. */
      window.location.href =
        androidPdfUrl;
    }

    setStatus(
      "PDF abierto. Usa el botón Compartir del visor del teléfono y elige WhatsApp."
    );
  }


  async function compartirPDF(
    tipo
  ){

    setStatus(
      "Preparando PDF y fotografías…"
    );

    const resultado =
      generarPDFInstantaneo(
        false
      );

    if(!resultado){
      return;
    }

    const archivos =
      construirArchivosCompartir(
        resultado
      );

    const shareDisponible =
      typeof navigator.share ===
        "function";

    const canShareDisponible =
      typeof navigator.canShare ===
        "function";

    const ua =
      navigator.userAgent || "";

    const esAndroid =
      /Android/i.test(ua);

    const esIOS =
      /iPhone|iPad|iPod/i.test(ua);


    /* ==========================================
       ANDROID + WHATSAPP — FLUJO FIABLE

       No intentamos enviar el archivo directamente
       a WhatsApp desde el navegador porque algunos
       Android ignoran el adjunto.

       Paso 1:
       - crear un PDF único con parte + fotos
       - descargarlo
       - mostrar "Abrir PDF para compartir"

       Paso 2:
       - abrir el PDF en el visor del teléfono
       - compartir desde el visor a WhatsApp
    ========================================== */

    if(
      esAndroid &&
      tipo === "whatsapp"
    ){

      if(
        photosPdfPreparing
      ){

        setStatus(
          "Las fotografías todavía se están preparando. Espera unos segundos y vuelve a pulsar WhatsApp."
        );

        return;
      }

      if(
        photosData.length > 0 &&
        photosPdfCache.length !==
          photosData.length
      ){

        setStatus(
          "Preparando fotografías. Espera unos segundos y vuelve a pulsar WhatsApp."
        );

        prepararFotosPdfCache(
          false
        );

        return;
      }

      const combinado =
        generarPDFAndroidConFotos();

      if(!combinado){
        return;
      }

      prepararPDFAndroidParaAbrir(
        combinado
      );

      /* Guardamos además una copia en Descargas. */
      descargarBlob(
        combinado.blob,
        combinado.nombreArchivo
      );

      setStatus(
        "PDF con fotografías preparado y descargado. Ahora pulsa «Abrir PDF para compartir» y elige WhatsApp desde el visor."
      );

      return;
    }


    /* Texto corto para Android.
       WhatsApp puede rechazar un share sin texto
       aunque el navegador abra correctamente
       el selector de aplicaciones. */
    const textoAndroid =
      `Parte diario de obra\n` +
      `Obra: ${obra.value}\n` +
      `Fecha: ${fecha.value}\n` +
      `Encargado: ${encargado.value.trim()}`;


    /* ==========================================
       INTENTO 1:
       PDF + FOTOS

       iPhone/iPad:
       SOLO archivos.

       Android:
       archivos + texto no vacío.
    ========================================== */

    if(shareDisponible){

      let intentarTodos =
        true;

      if(canShareDisponible){

        try{

          intentarTodos =
            navigator.canShare({
              files:archivos
            });

        }catch{

          intentarTodos =
            true;
        }
      }

      if(intentarTodos){

        try{

          const datosCompartir =
            {
              files:archivos
            };

          if(esAndroid){

            datosCompartir.text =
              textoAndroid;
          }

          await navigator.share(
            datosCompartir
          );

          setStatus(
            "PDF y fotografías compartidos correctamente."
          );

          return;

        }catch(error){

          if(
            error &&
            error.name ===
              "AbortError"
          ){

            setStatus(
              "Compartir cancelado."
            );

            return;
          }

          console.warn(
            "Error al compartir PDF + fotos:",
            error
          );

          const nombreError =
            error?.name ||
            "Error";

          const mensajeError =
            error?.message ||
            "sin detalle";

          setStatus(
            `No se pudieron compartir PDF + fotos (${nombreError}: ${mensajeError}). Probando solo el PDF…`
          );
        }
      }
    }


    /* ==========================================
       INTENTO 2:
       SOLO PDF
    ========================================== */

    if(shareDisponible){

      const soloPDF =
        [archivos[0]];

      let intentarPDF =
        true;

      if(canShareDisponible){

        try{

          intentarPDF =
            navigator.canShare({
              files:soloPDF
            });

        }catch{

          intentarPDF =
            true;
        }
      }

      if(intentarPDF){

        try{

          const datosPDF =
            {
              files:soloPDF
            };

          if(esAndroid){

            datosPDF.text =
              textoAndroid;
          }

          await navigator.share(
            datosPDF
          );

          setStatus(
            photosData.length > 0
              ? "PDF compartido. Este dispositivo no permitió compartir las fotografías junto con el PDF."
              : "PDF compartido correctamente."
          );

          return;

        }catch(error){

          if(
            error &&
            error.name ===
              "AbortError"
          ){

            setStatus(
              "Compartir cancelado."
            );

            return;
          }

          console.warn(
            "Error al compartir solo PDF:",
            error
          );

          const nombreError =
            error?.name ||
            "Error";

          const mensajeError =
            error?.message ||
            "sin detalle";

          setStatus(
            `El dispositivo tampoco permitió compartir solo el PDF (${nombreError}: ${mensajeError}). Descargando archivos…`
          );
        }
      }
    }


    /* ==========================================
       RESPALDO:
       DESCARGA

       En PC, si es correo, abrimos después
       el cliente de correo preparado.
    ========================================== */

    try{

      await fallbackDescargas(
        resultado
      );

      if(
        tipo === "correo" &&
        !esAndroid &&
        !esIOS
      ){

        setStatus(
          "PDF y fotografías descargados. Abriendo el correo en el ordenador…"
        );

        setTimeout(
          () => {
            abrirCorreoPC();
          },
          700
        );

        return;
      }

      setStatus(
        "PDF y fotografías descargados. Puedes compartirlos desde Descargas/Archivos."
      );

    }catch(error){

      console.error(
        "Error al descargar los archivos:",
        error
      );

      setStatus(
        "No se pudo compartir ni descargar automáticamente. Usa el botón «Generar PDF»."
      );
    }
  }


  async function enviarParteCorreoAutomatico(){

    const botonCorreo =
      el("correoBtn");

    try{

      botonCorreo.disabled =
        true;

      setStatus(
        "Generando PDF y preparando el correo…"
      );

      const resultado =
        await generarPDF(
          false
        );

      if(!resultado){
        return;
      }

      const formData =
        new FormData();

      formData.append(
        "pdf",
        resultado.blob,
        resultado.nombreArchivo
      );

      photosData.forEach(
        (foto, indice) => {

          formData.append(
            "fotos",
            foto.blob,
            foto.name ||
              `Foto_${indice + 1}.jpg`
          );
        }
      );

      formData.append(
        "obra",
        obra.value
      );

      formData.append(
        "fecha",
        fecha.value
      );

      formData.append(
        "encargado",
        encargado.value.trim()
      );

      formData.append(
        "notas",
        notas.value.trim()
      );

      setStatus(
        "Enviando parte por correo…"
      );

      const respuesta =
        await fetch(
          `${BACKEND_URL}/enviar-parte`,
          {
            method:"POST",
            body:formData
          }
        );

      let datos = {};

      try{
        datos =
          await respuesta.json();
      }catch{
        datos = {};
      }

      if(!respuesta.ok){

        throw new Error(
          datos.mensaje ||
          `Error HTTP ${respuesta.status}`
        );
      }

      setStatus(
        `✅ Parte enviado por correo correctamente${datos.destinatarios ? ` a ${datos.destinatarios}` : ""}.`
      );

    }catch(error){

      console.error(
        "Error en el envío automático:",
        error
      );

      setStatus(
        "No se pudo enviar automáticamente (" +
        error.message +
        "). Probando el método de respaldo…"
      );

      await compartirPDF(
        "correo"
      );

    }finally{

      botonCorreo.disabled =
        false;
    }
  }


  async function compartirParteCorreo(){

    await enviarParteCorreoAutomatico();
  }


  async function compartirParteWhatsApp(){

    await compartirPDF(
      "whatsapp"
    );
  }


  /* =====================================================
     CIERRE / RESET
  ====================================================== */

  function validate(){

    const errors = [];

    if(!obra.value){
      errors.push(
        "seleccionar la obra"
      );
    }

    if(!fecha.value){
      errors.push(
        "indicar la fecha"
      );
    }

    if(
      !encargado.value.trim()
    ){
      errors.push(
        "indicar el encargado"
      );
    }

    if(
      !audioBlob &&
      !notas.value.trim()
    ){
      errors.push(
        "grabar un audio o añadir información"
      );
    }

    return errors;
  }


  async function closePart(){

    const errors =
      validate();

    if(errors.length){

      setStatus(
        "Antes de cerrar debes: " +
        errors.join(", ") +
        "."
      );

      return;
    }

    estado.value =
      "Cerrado";

    await saveDraft(
      "Parte cerrado y guardado."
    );
  }


  async function resetDraft(){

    if(
      !confirm(
        "¿Seguro que quieres borrar el borrador, incluyendo audio y fotos?"
      )
    ){
      return;
    }

    stopTracks();

    if(
      mediaRecorder &&
      mediaRecorder.state !==
        "inactive"
    ){

      try{
        mediaRecorder.stop();
      }catch{}
    }

    await deleteDraft();

    revokeAudioUrl();

    obra.value = "";
    fecha.value =
      todayISO();

    encargado.value = "";
    estado.value =
      "Borrador";

    notas.value = "";

    fotos.value = "";
    audioUpload.value = "";

    audioBlob = null;
    photosData = [];
    photosPdfCache = [];
    photosPdfPreparing = false;

    limpiarPDFAndroidPreparado();

    renderPhotos();
    showAudio(null);

    setStatus(
      "Borrador eliminado."
    );
  }


  /* =====================================================
     GUARDADO AUTOMÁTICO
  ====================================================== */

  let autoTimer =
    null;

  function autoSave(){

    clearTimeout(
      autoTimer
    );

    autoTimer =
      setTimeout(
        () => {

          saveDraft(
            "Guardado automático."
          );

        },
        500
      );
  }


  /* =====================================================
     INICIO
  ====================================================== */

  async function init(){

    detectarCompatibilidad();

    /* Precargamos el logo al abrir la aplicación.
       Compartir no tendrá que esperar luego a fetch/FileReader. */
    cargarLogoPDF()
      .catch(error => {
        console.warn(
          "El logo no pudo precargarse:",
          error
        );
      });

    try{

      cargarObrasPersonalizadas();

      db =
        await openDB();

      await loadDraft();

    }catch(error){

      console.error(
        error
      );

      setStatus(
        "No se pudo iniciar el almacenamiento local."
      );
    }


    [
      obra,
      fecha,
      encargado,
      notas
    ].forEach(
      node => {

        node.addEventListener(
          "input",
          autoSave
        );

        node.addEventListener(
          "change",
          autoSave
        );
      }
    );


    el("nuevaObraBtn")
      .addEventListener(
        "click",
        () => {

          el("nuevaObraBox")
            .classList.toggle(
              "hidden"
            );
        }
      );


    el("guardarNuevaObra")
      .addEventListener(
        "click",
        crearNuevaObra
      );


    fotos.addEventListener(
      "change",
      handlePhotos
    );


    audioUpload
      .addEventListener(
        "change",
        handleAudioUpload
      );


    recordBtn
      .addEventListener(
        "click",
        startRecording
      );


    stopBtn
      .addEventListener(
        "click",
        stopRecording
      );


    el("transcribirBtn")
      .addEventListener(
        "click",
        transcribirAudio
      );


    el("deleteAudio")
      .addEventListener(
        "click",
        async () => {

          const confirmar = confirm(
            "¿Seguro que quieres eliminar este audio?"
          );

          if(!confirmar){
            return;
          }

          showAudio(null);

          audioUpload.value =
            "";

          await saveDraft(
            "Audio eliminado correctamente."
          );
        }
      );


    el("clearPhotos")
      .addEventListener(
        "click",
        async () => {

          photosData = [];
          photosPdfCache = [];
          photosPdfPreparing = false;

          limpiarPDFAndroidPreparado();

          fotos.value =
            "";

          renderPhotos();

          await saveDraft(
            "Fotografías eliminadas."
          );
        }
      );


    el("guardar")
      .addEventListener(
        "click",
        () => saveDraft()
      );


    el("pdfBtn")
      .addEventListener(
        "click",
        () => generarPDF(true)
      );


    el("correoBtn")
      .addEventListener(
        "click",
        compartirParteCorreo
      );


    el("whatsappBtn")
      .addEventListener(
        "click",
        compartirParteWhatsApp
      );


    el("abrirPDFAndroidBtn")
      .addEventListener(
        "click",
        abrirPDFAndroid
      );


    el("cerrar")
      .addEventListener(
        "click",
        closePart
      );


    el("limpiar")
      .addEventListener(
        "click",
        resetDraft
      );


    window.addEventListener(
      "beforeunload",
      () => {
        stopTracks();
        limpiarPDFAndroidPreparado();
      }
    );
  }


  init();

})();
</script>
